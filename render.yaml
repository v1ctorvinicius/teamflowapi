# render.yaml
services:
  - type: web
    name: teamflow-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: teamflow-db
          property: connectionString
      - key: JWT_PRIVATE_KEY
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

  - type: postgres
    name: teamflow-db
    plan: free
    databaseName: teamflow_prod
    postgresMajorVersion: 15
